<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>Healthy Habit Tracker (Mobile)</title>
<link rel="manifest" href="manifest.json"/>
<meta name="theme-color" content="#16a34a"/>
<link rel="stylesheet" href="style.css"/>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="title">
      <h1>Healthy Habit Tracker</h1>
      <p class="muted">Habits • Reminders</p>
    </div>
    <div class="actions">
      <button id="installBtn" class="btn primary" style="display:none">Install</button>
      <button id="menuBtn" class="btn">Menu</button>
    </div>
  </header>

  <div id="installHint" class="hint" style="display:none">Tip: Tap Install to add to Home screen for app-like experience.</div>

  <main>
    <nav id="sidebar" class="card">
      <h3>Controls</h3>
      <div class="row small">
        <button id="notifyPermBtn" class="btn">Notify</button>
        <button id="testAlarmBtn" class="btn">Test</button>
      </div>
      <hr/>
      <form id="habitForm">
        <input id="habitName" placeholder="Habit name" required/>
        <label>Reminder time</label>
        <input id="habitTime" type="time"/>
        <div class="row">
          <button class="btn primary" type="submit">Save</button>
          <button id="clearBtn" class="btn" type="button">Clear</button>
        </div>
      </form>
    </nav>

    <section class="content">
      <div class="card">
        <h2>Today</h2>
        <div id="habitsList" class="list"></div>
        <p id="noHabits" class="muted">No habits yet.</p>
        <div id="debugLog" class="muted small"></div>
      </div>
    </section>
  </main>

  <footer class="foot">
    <small class="muted">Install for native look. Host on HTTPS for full PWA.</small>
  </footer>
</div>

<script src="script.js"></script>
</body>
</html>
